<!-- переходы между шагами: страница показывается только когда она уже наверху (без прыжка вниз-вверх) -->
<style id="nav-hide">html{opacity:0}</style>
<script>
(function(){
  try { history.scrollRestoration = 'manual'; } catch(e) {}
  function top(){ window.scrollTo(0,0); document.documentElement.scrollTop = 0; if (document.body) document.body.scrollTop = 0;
    try { document.documentElement.scrollIntoView({block:'start', behavior:'instant'}); } catch(e) {} }
  function reveal(){ var s = document.getElementById('nav-hide'); if (s) s.remove(); }
  function show(){ top(); requestAnimationFrame(function(){ top(); requestAnimationFrame(function(){ top(); reveal(); }); }); }
  document.addEventListener('DOMContentLoaded', show);
  addEventListener('pageshow', function(e){ if (e.persisted) { document.documentElement.style.opacity = ''; show(); } });
  setTimeout(reveal, 1500);
  window.mindoraTop = top;
  /* переход на следующий шаг: прячем страницу, поднимаем наверх, ждём 2 кадра, уходим */
  window.mindoraGo = function(url){ document.documentElement.style.opacity = '0'; top();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ location.href = url; }); }); };
})();
</script>

/* каждый шаг и даунсел всегда открываются сверху страницы */
try { history.scrollRestoration = 'manual'; } catch(e) {}
function toTop(){ window.mindoraTop(); }
addEventListener('load', toTop); addEventListener('pageshow', toTop);
const qs = new URLSearchParams(location.search);
const key = OFFERS[qs.get('step')] ? qs.get('step') : 'coach';
const O = OFFERS[key];
let state = qs.get('state') === 'downsell' ? 'downsell' : 'offer';

/* DEV: в продакшене сервер отдаёт FUNNEL.kit */
const KIT = qs.get('kit') || (window.FUNNEL && FUNNEL.kit) || (()=>{ try { return sessionStorage.getItem('mindora_kit'); } catch(e){ return null; } })() || 'guide';
try { if (qs.get('kit')) sessionStorage.setItem('mindora_kit', qs.get('kit')); } catch(e) {}
const TOTAL = 6; /* во всех воронках 6 шагов */
const STEP = O.step - (6 - TOTAL);
if (TOTAL === 5) document.querySelector('#steps li:last-child').remove();
document.getElementById('steplabel').textContent = 'Step ' + STEP + '/' + TOTAL;
document.querySelectorAll('#steps li').forEach((li,i) => {
  if (i < STEP - 1) { li.className = 'done'; li.textContent = '✓'; }
  else if (i === STEP - 1) { li.className = 'now'; li.setAttribute('aria-current','step'); }
});
document.getElementById('steps').setAttribute('aria-label','Step ' + STEP + ' of ' + TOTAL);

function card(S){
  const save = (S.was - S.price).toFixed(2).replace(/\.00$/,'');
  return `<div class="pcard"><div class="pitems">${O.items.map(i => `<div class="pitem"><div class="ico">${i[0]}</div><div><b>${i[1]}</b><span>${i[2]}</span></div></div>`).join('')}</div>
    <div class="pprice"><div class="pr"><s>$${S.was}</s><b>$${S.price}</b></div><span class="save">−$${save} saved</span></div></div>`;
}
function render(){
  const S = O[state];
  document.body.classList.toggle('downsell', state === 'downsell');
  document.getElementById('alert').textContent = S.alert;
  document.getElementById('app').innerHTML = `
    <section class="hero"><span class="badge">${S.badge}</span><h1>${S.h1}</h1><p>${S.sub}</p><p class="softprice">Today <s>$${S.was}</s> <b>$${S.price}</b> · one-time, not a subscription</p></section>
    ${O.visual}
    <p class="lead2">${O.lead}</p>
    ${card(S)}
    <h2>What you get</h2>
    <div class="gets">${O.gets.map(g => `<div class="get"><div class="hd"><b>${g[0]}</b><span>${g[1]}</span></div><p>${g[2]}</p></div>`).join('')}</div>
    ${O.extra.replace('__P__', S.price)}
    <div class="why"><b>Why it's worth it</b><ul>${O.why.map(w => `<li>${w}</li>`).join('')}</ul></div>
    <div class="bottom" id="bottom">
      <div class="pay"><span>stripe</span><span>VISA</span><span>Mastercard</span><span>Apple Pay</span><span>G Pay</span></div>
      <p class="terms">One-time charge of $${S.price} to your saved card. Not a subscription.</p>
      <div style="margin-top:16px"><button class="btn" data-buy>Add to order →</button></div>
      <p class="err" role="alert"></p>
      <button class="no" data-no>No thanks</button>
    </div>`;
  watchBottom();
  bind(); toTop();
}
function watchBottom(){
  const sticky = document.querySelector('.sticky');
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => sticky.classList.toggle('gone', e.isIntersecting)), {rootMargin:'0px 0px -40px 0px'});
  io.observe(document.getElementById('bottom'));
}
function bind(){
  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buy(b));
  document.querySelectorAll('[data-no]').forEach(b => b.onclick = decline);
}
function go(url){ window.mindoraGo(url); }
function openDownsell(){
  const S = O.downsell, save = (S.was - S.price).toFixed(2).replace(/\.00$/,'');
  document.getElementById('ds-tag').textContent = S.badge;
  document.getElementById('ds-title').textContent = S.h1;
  document.getElementById('ds-sub').textContent = S.alert;
  document.getElementById('ds-price').innerHTML = `<s>$${S.was}</s><b>$${S.price}</b><span class="save">−$${save} saved</span>`;
  const err = document.getElementById('ds-err'); err.style.display = 'none'; err.textContent = '';
  document.getElementById('ds-buy').disabled = false;
  document.getElementById('dsModal').classList.add('open');
  document.getElementById('ds-buy').focus();
}
function closeDownsell(){ document.getElementById('dsModal').classList.remove('open'); }
function declineDownsell(){ closeDownsell(); go(O.next); }
function decline(){
  if (state === 'offer') openDownsell();
  else go(O.next);
}
function remember(){ try { const k='mindora_owned', l=JSON.parse(sessionStorage.getItem(k)||'[]'), n=({mindora_coach:'Mindora AI coach', prompt_library:'Full Prompt Library (28,000+)', planners_bundle:'10 planners bundle'})[O.product]; if(!l.includes(n)) l.push(n); sessionStorage.setItem(k, JSON.stringify(l)); } catch(e) {} }
function mindoraStripe() {
  if (!FUNNEL.stripePublishableKey || typeof Stripe === 'undefined') return null;
  if (!window.__mindoraStripe) window.__mindoraStripe = Stripe(FUNNEL.stripePublishableKey);
  return window.__mindoraStripe;
}
async function funnelCharge(price, chargeState = state) {
  const body = { token: FUNNEL.token, product: O.product, state: chargeState, price };
  let r = await fetch('/api/funnel/charge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let d = await r.json();
  if (d.requires_action && d.client_secret) {
    const stripe = mindoraStripe();
    if (!stripe) throw new Error('Card authentication required');
    const { error } = await stripe.handleNextAction({ clientSecret: d.client_secret });
    if (error) throw error;
    r = await fetch('/api/funnel/charge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    d = await r.json();
  }
  if (!r.ok || d.success === false) throw new Error(d.message || 'Payment failed');
  if (d.token) FUNNEL.token = d.token;
  return d;
}
async function buy(btn){
  const S = O[state], err = document.querySelector('.err');
  document.querySelectorAll('[data-buy]').forEach(b => b.disabled = true);
  try {
    const d = await funnelCharge(S.price);
    remember();
    go(d.nextUrl || O.next);
  } catch(e) {
    if (FUNNEL.preview) { remember(); go(O.next); return; }
    err.textContent = (e.message || 'Something went wrong') + '. Try again or skip this offer.'; err.style.display = 'block';
    document.querySelectorAll('[data-buy]').forEach(b => b.disabled = false);
  }
}
async function buyDownsell(){
  const btn = document.getElementById('ds-buy'), err = document.getElementById('ds-err');
  btn.disabled = true; err.style.display = 'none';
  try {
    const d = await funnelCharge(O.downsell.price, 'downsell');
    remember();
    go(d.nextUrl || O.next);
  } catch(e) {
    if (FUNNEL.preview) { remember(); go(O.next); return; }
    err.textContent = (e.message || 'Something went wrong') + '. Try again or skip this offer.'; err.style.display = 'block';
    btn.disabled = false;
  }
}
document.getElementById('ds-buy').addEventListener('click', buyDownsell);
document.getElementById('ds-no').addEventListener('click', declineDownsell);
document.getElementById('dsModal').addEventListener('click', e => { if (e.target.id === 'dsModal') declineDownsell(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('dsModal').classList.contains('open')) declineDownsell(); });
/* возврат кнопкой «Назад» из bfcache: страница возвращается с заблокированными кнопками и открытой модалкой */
addEventListener('pageshow', e => {
  if (!e.persisted) return;
  document.documentElement.style.opacity = '';
  closeDownsell();
  document.querySelectorAll('[data-buy]').forEach(b => b.disabled = false);
});
render();
</script>
